spring:
  datasource:
    url: jdbc:h2:mem:companages;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: create-drop
    open-in-view: false
  flyway.enabled: false
  mail:
    host: localhost
    port: 1025
app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long
    expiration-ms: 3600000
    refresh-expiration-ms: 2592000000
  cors.allowed-origin: http://localhost:4200
  frontend-url: http://localhost:4200
  mail-from: test@companages.local
