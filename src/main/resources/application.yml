spring:
  application:
    name: companages
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/companages}
    username: ${POSTGRES_USER:companages}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error:
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
