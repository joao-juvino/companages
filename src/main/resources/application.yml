spring:
  application:
    name: companages
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/companages}
    username: ${POSTGRES_USER:companages}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  error:
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION:2592000000}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:noreply@companages.local}
  mail-provider: ${MAIL_PROVIDER:smtp}
  emailjs:
    service-id: ${EMAILJS_SERVICE_ID:}
    template-id: ${EMAILJS_TEMPLATE_ID:}
    public-key: ${EMAILJS_PUBLIC_KEY:}
    private-key: ${EMAILJS_PRIVATE_KEY:}
  demo:
    enabled: ${DEMO_DATA:false}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
